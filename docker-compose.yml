# Resolver MoveMarket di VPS. Jalankan dari folder kerja (berisi source/ dan backend/):
#   docker compose -f backend/docker-compose.yml up -d --build
# Satu instance saja: registry partai, pasar, replay, dan SSE ada di memori proses (jangan di-scale).
# Env dan kredensial: backend/README.md bagian Deploy.
services:
  resolver:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: movemarket-resolver
    container_name: movemarket-resolver
    restart: unless-stopped
    # Secret dan override (RESOLVER_PRIVATE_KEY, FAUCET_PRIVATE_KEY, ADMIN_TOKEN, CRE_ETH_PRIVATE_KEY, CORS_ORIGIN, ...).
    env_file: resolver/.env
    ports:
      - "127.0.0.1:8787:8787" # publik hanya lewat reverse proxy TLS (deploy/Caddyfile)
    volumes:
      # Sesi `cre login` khusus server (cre.yaml); CLI menulis ulang token di sini, jadi harus writable oleh uid 1000.
      - ./.cre-auth:/home/bun/.cre
